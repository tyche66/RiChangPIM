# 入口 HTML 每次重新校验；带内容哈希的静态资源（后台 /admin/assets/、门户 /assets/）
# 才允许长缓存，文件名随内容变化自然失效。
map $uri $spa_cache_control {
    ~*^/admin/assets/  "public, max-age=31536000, immutable";
    ~*^/assets/        "public, max-age=31536000, immutable";
    default            "no-cache";
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    client_max_body_size 100M;

    # SPA 缓存策略（2026-10-26 补齐）：入口 HTML 一律 no-cache 每次重新校验，
    # 带内容哈希的 /assets/ 才允许长缓存。缺了这条时，发版后浏览器拿着旧
    # index.html 去请求已不存在的内容哈希 chunk → 404 → 白屏，必须刷新才好。
    add_header Cache-Control $spa_cache_control always;

    # 所有 301/302 的 Location 用相对路径。
    # nginx 默认拼绝对地址（http://$host + 监听端口），而这个 server 在容器里听的是
    # 80、对外映射成 888，$host 里又不带端口 —— 于是 http://localhost:888/admin 会被
    # 301 到 http://localhost/admin/（掉到 80 端口，连不上/是别的站）→ 用户看到白屏。
    # 实测 2026-07-31：改之前 curl -w '%{redirect_url}' 拿到的就是
    # http://127.0.0.1/admin/。关掉之后 Location: /admin/，由浏览器按原始
    # scheme://host:port 解析，本地 :888 和公网隧道都对。
    absolute_redirect off;

    # 后台是以 base '/admin/' 构建的，所有资源都在 /admin/ 前缀下。
    # 没有这条精确匹配时，用户输入不带尾斜杠的 http://host/admin 会掉进
    # location /（门户 SPA），门户没有这条路由 → 白屏。alias 不会自动补尾斜杠，
    # 所以必须显式 301。
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /usr/share/nginx/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 公开分享页 /share/{token} 由门户承载（portal/src/views/SharePage.vue）。
    # 这里不单独开 location：交给下面的 location / → try_files 回落到门户
    # index.html，由门户路由匹配 /share/:token。曾经这里 alias 到 admin 目录，
    # 那是后台按 base '/' 构建时代的补丁，现在会加载到错误的资源前缀。

    location / {
        root /usr/share/nginx/portal;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /health/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ai/chat {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/v1/knowledge/query {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Content generation and topic generation can legitimately take longer
    # than nginx's 60s default (step-5-preview cold start measured ~15s, and
    # upstream queues can add more). Keep this above CONTENT_AI_TIMEOUT so a
    # slow-but-successful generation is not turned into a 504 while the
    # backend still commits the batch.
    location /api/v1/content/batches {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }

    location /api/v1/content/topics/runs {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }

    # 带图批量导入。前缀匹配同时覆盖 GET /api/v1/products/import-template
    # （模板下载），对它无副作用。location 不继承外层的 proxy_set_header，
    # 所以这里必须把 /api/ 那一套原样重复一遍。
    location /api/v1/products/import {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # 跟 backend 的 PRODUCT_IMPORT_MAX_FILE_BYTES（默认 512MB）对齐，两边要一起改：
        # nginx 先卡住的话用户只看到 nginx 那张 413 HTML，读不到接口返回的
        # 「上传文件过大」中文提示。512M 是照真实供应商样本定的（圣奥那份 4255 行 +
        # 4242 张图的包压缩后 259MB）。
        client_max_body_size 512M;
        # 由 nginx 先把整个请求体收完（默认行为，写在这里是为了别被后人改掉）：
        # 后端读的是这份已经落地的请求体，不用陪着慢上行链路一起等。
        proxy_request_buffering on;
        # 几百 MB 的压缩包要解包、逐张算 sha256、再逐张传 MinIO，默认 60s 差两个数量级；
        # 4242 张图这个量级按分钟计，300s 也不保险。
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    location /docs {
        proxy_pass $backend_upstream;
    }

    location /openapi.json {
        proxy_pass $backend_upstream;
    }
}
