server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    client_max_body_size 100M;

    location /admin/ {
        alias /usr/share/nginx/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /share/ {
        alias /usr/share/nginx/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        root /usr/share/nginx/portal;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /health/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ai/chat {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/v1/knowledge/query {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 带图批量导入。前缀匹配同时覆盖 GET /api/v1/products/import-template
    # （模板下载），对它无副作用。location 不继承外层的 proxy_set_header，
    # 所以这里必须把 /api/ 那一套原样重复一遍。
    location /api/v1/products/import {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # 跟 backend 的 PRODUCT_IMPORT_MAX_FILE_BYTES（默认 512MB）对齐，两边要一起改：
        # nginx 先卡住的话用户只看到 nginx 那张 413 HTML，读不到接口返回的
        # 「上传文件过大」中文提示。512M 是照真实供应商样本定的（圣奥那份 4255 行 +
        # 4242 张图的包压缩后 259MB）。
        client_max_body_size 512M;
        # 由 nginx 先把整个请求体收完（默认行为，写在这里是为了别被后人改掉）：
        # 后端读的是这份已经落地的请求体，不用陪着慢上行链路一起等。
        proxy_request_buffering on;
        # 几百 MB 的压缩包要解包、逐张算 sha256、再逐张传 MinIO，默认 60s 差两个数量级；
        # 4242 张图这个量级按分钟计，300s 也不保险。
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    location /docs {
        proxy_pass $backend_upstream;
    }

    location /openapi.json {
        proxy_pass $backend_upstream;
    }
}

server {
    listen 443 ssl;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100M;

    location /admin/ {
        alias /usr/share/nginx/admin/;
        try_files $uri $uri/ /admin/index.html;
