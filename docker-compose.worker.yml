worker:
  build:
    context: ./backend
    args:
      APP_VERSION: ${APP_VERSION:-1.9.3}
      BUILD_ID: ${BUILD_ID:-dev-local}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
      APP_ENV: ${APP_ENV:-production}
  command: ["python", "-m", "app.scripts.worker"]
  environment:
    - DATABASE_URL=postgresql://pim:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/ai_pim
    - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
    - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}
    - REDIS_URL=redis://redis:6379/0
    - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    - APP_ENV=${APP_ENV:-production}
    - REMINDER_HOUR=${REMINDER_HOUR:-9}
    - REMINDER_SKIP_WEEKEND=${REMINDER_SKIP_WEEKEND:-false}
    - REMINDER_ADOPT_DAYS=${REMINDER_ADOPT_DAYS:-2}
    - REMINDER_PUBLISH_DAYS=${REMINDER_PUBLISH_DAYS:-2}
    - REMINDER_METRIC_DAYS=${REMINDER_METRIC_DAYS:-1,3,7}
    - REMINDER_ESCALATE_HOURS=${REMINDER_ESCALATE_HOURS:-24}
    - REMINDER_LLM_POLISH=${REMINDER_LLM_POLISH:-false}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import pathlib,time,sys; p=pathlib.Path('/tmp/worker_heartbeat'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime<180 else 1)"]
    interval: 60s
    timeout: 5s
    retries: 3
  restart: unless-stopped
